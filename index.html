<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat the Trouble</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="arcade">
        <div class="topo">★ RETRO ARCADE ★</div>

        <h1>BEAT THE <span>TROUBLE</span></h1>
        <p class="subtitulo">WALK AWAY. STAY COOL.</p>

        <section class="jogo">

            <div class="status">
                <p id="nivel">LEVEL 01</p>
                <p id="pontuacao">★ 0 PTS</p>
            </div>

            <div class="barra">
                <div id="progresso"></div>
            </div>

            <h2 id="pergunta">Pronta para jogar?</h2>

            <div id="opcoes"></div>
            <p id="resultado"></p>

            <button id="proximo" class="escondido">
                PRÓXIMO →
            </button>

            <button id="compartilhar" class="escondido">
                ★ COMPARTILHAR MEU CAOS ★
            </button>

            <button id="iniciar">START GAME</button>
        </section>

        <footer>INSERT COURAGE • NOT COINS</footer>
    </main>
</body>

</html>
